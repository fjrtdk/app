name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build web app
        run: yarn build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      
      - name: Install required Android SDK packages
        run: |
          $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME > /dev/null 2>&1 || true

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Inject google-services.json
        env:
          FIREBASE_GS_JSON: ${{ secrets.FIREBASE_GS_JSON }}
        run: |
          if [ -n "$FIREBASE_GS_JSON" ]; then
            echo "$FIREBASE_GS_JSON" > android/app/google-services.json
            echo "google-services.json injected"
          else
            echo "WARNING: FIREBASE_GS_JSON secret not set — Google Sign-In won't work"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prompt-optimizer-debug
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
